      <h2 class="section-title">What Is Crypto Bot?</h2>
      <p>
        Crypto Bot is a Telegram crypto bot that turns the world's most popular messaging app into a full-featured crypto management platform. It lets you hold, buy, sell, send, and receive cryptocurrency — all from inside Telegram, with no separate apps or exchanges required.
      </p>
      <p>
        The bot is designed to be accessible to everyone: beginners who have never touched crypto and experienced users who want a faster, more convenient way to manage digital assets. This guide walks you through every core feature so you can get the most out of Crypto Bot from day one.
      </p>

      <h2 class="section-title" style="margin-top:48px;">Getting Started: How to Open Crypto Bot</h2>
      <p>
        To start using Crypto Bot, open Telegram and tap <a href="https://bit.ly/4jo0oou" target="_blank" rel="noopener">this link</a>, or search for the bot by name inside the Telegram search bar. When the bot appears in your search results, tap it and press the <strong>Start</strong> button.
      </p>
      <p>
        That is all you need to do. Crypto Bot automatically sets up a wallet for you, linked to your Telegram account. There is no email, no password, and no identity form to fill out just to get started. Your Telegram account is your login.
      </p>

      <h2 class="section-title" style="margin-top:48px;">Step-by-Step Guide: How to Use Crypto Bot</h2>

      <h3 style="margin-top:32px;">Step 1 — Open Crypto Bot in Telegram</h3>
      <p>
        Tap the official Crypto Bot link or find the bot in Telegram search. Press <em>Start</em>. The bot greets you with a menu of options including Wallet, Buy, Send, Exchange, and P2P. This is your control center for all crypto activity.
      </p>

      <h3 style="margin-top:28px;">Step 2 — Explore Your Wallet</h3>
      <p>
        Tap <strong>Wallet</strong> in the bot menu. Here you can see all your crypto balances across supported assets — TON, Bitcoin, USDT, and more. The wallet screen also shows your deposit addresses, so you can receive crypto from external wallets or other people.
      </p>
      <p>
        To receive crypto from someone outside Telegram, tap on the asset you want to receive and copy your deposit address. Share this address with the sender the same way you would share any wallet address.
      </p>

      <h3 style="margin-top:28px;">Step 3 — Buy Crypto</h3>
      <p>
        Tap <strong>Buy</strong> in the main menu. Choose the cryptocurrency you want to purchase — for example, TON or Bitcoin. Next, select your payment method. Crypto Bot typically offers card payments and P2P buying. Enter the amount you want to spend in fiat currency and review the crypto amount you will receive. Confirm the purchase and follow the payment prompts.
      </p>
      <p>
        For card purchases, you may be briefly redirected to a secure payment page. Once payment is confirmed, your crypto appears in your wallet within seconds.
      </p>

      <h3 style="margin-top:28px;">Step 4 — Send Crypto</h3>
      <p>
        Tap <strong>Send</strong> to transfer crypto to someone else. You can send to another Telegram user by their @username — no need to know their wallet address. You can also send to any external crypto wallet address by pasting the address into the recipient field.
      </p>
      <p>
        Select the asset, enter the amount, double-check the recipient, and confirm. The transaction is submitted to the blockchain and typically confirms within seconds for TON, or within a few minutes for Bitcoin depending on network conditions.
      </p>

      <h3 style="margin-top:28px;">Step 5 — Use the Exchange (Swap)</h3>
      <p>
        The <strong>Exchange</strong> feature lets you swap one cryptocurrency for another without leaving Telegram. For example, swap USDT for TON, or Bitcoin for USDT. Tap Exchange, select the asset you have and the asset you want, enter the amount, and confirm at the displayed rate.
      </p>
      <p>
        The built-in exchange uses competitive market rates. Always review the rate and any applicable fee on the summary screen before confirming your swap.
      </p>

      <h3 style="margin-top:28px;">Step 6 — Trade on the P2P Marketplace</h3>
      <p>
        The <strong>P2P</strong> marketplace connects you with other Crypto Bot users who want to buy or sell crypto using local payment methods. This is useful when you want to use a bank transfer, mobile payment, or other regional payment method that may not be available for direct card purchases.
      </p>
      <p>
        To buy on P2P, browse available offers and select one that suits your amount and payment method. After you confirm, the seller's crypto is held in escrow. You send the fiat payment directly to the seller through the agreed method, then confirm payment in the bot. The seller confirms receipt, and the crypto is released to your wallet. The escrow system means you cannot lose your money without receiving the crypto you paid for.
      </p>
      <p>
        To sell on P2P, create an offer or respond to an existing buy request. Your crypto goes into escrow while you wait for the buyer's payment. Once you confirm the payment arrived, the buyer's fiat is on its way to you and the crypto is released from escrow.
      </p>

      <h3 style="margin-top:28px;">Step 7 — Accept Crypto Payments with Crypto Pay</h3>
      <p>
        If you run a business or sell anything online, <strong>Crypto Pay</strong> lets you accept cryptocurrency from customers directly through Telegram. Generate a payment link or invoice for a specific amount, share it with your customer, and get notified when the payment arrives.
      </p>
      <p>
        This feature is popular with freelancers, small online stores, and Telegram channel owners who want to monetize their audience with crypto payments. Learn more on the <a href="https://www.cryptobot.ltd/crypto-pay">Crypto Pay page</a>.
      </p>

      <h2 class="section-title" style="margin-top:48px;">Supported Cryptocurrencies</h2>
      <p>
        Crypto Bot supports a growing list of assets including:
      </p>
      <ul style="padding-left:1.4em;line-height:2;">
        <li><strong>TON (Toncoin)</strong> — the native asset of The Open Network, deeply integrated with Telegram</li>
        <li><strong>Bitcoin (BTC)</strong> — the world's most recognized cryptocurrency</li>
        <li><strong>USDT (Tether)</strong> — a USD-pegged stablecoin for stable-value transfers and trading</li>
        <li><strong>Other tokens</strong> — check the bot's current asset list as new assets are added regularly</li>
      </ul>

      <h2 class="section-title" style="margin-top:48px;">Tips for New Users</h2>
      <div class="info-grid">
        <div>
          <h3>Enable Two-Step Verification</h3>
          <p>Secure your Telegram account with two-step verification (Settings → Privacy and Security → Two-Step Verification). This adds a password layer that protects your Crypto Bot wallet.</p>
        </div>
        <div>
          <h3>Start Small</h3>
          <p>If you are new to crypto, start with a small purchase to learn the flow before committing larger amounts. Crypto prices are volatile — only use funds you can afford to lose.</p>
        </div>
        <div>
          <h3>Double-Check Addresses</h3>
          <p>When sending to an external wallet, always verify the recipient address carefully. Blockchain transactions are irreversible, so a wrong address means lost funds.</p>
        </div>
        <div>
          <h3>Compare P2P Offers</h3>
          <p>On the P2P marketplace, different sellers offer different rates and payment methods. Take a moment to compare offers before committing to a trade.</p>
        </div>
        <div>
          <h3>Review Fees Before Confirming</h3>
          <p>Crypto Bot shows a clear fee summary before every transaction. Always read this screen so you know exactly what you are paying and what you will receive.</p>
        </div>
        <div>
          <h3>Use Only the Official Link</h3>
          <p>Only access Crypto Bot through the official link or by searching the verified bot name. Be cautious of unofficial links shared in groups, as phishing bots exist.</p>
        </div>
      </div>

      <h2 class="section-title" style="margin-top:48px;">Fees Overview</h2>
      <p>
        Crypto Bot's wallet is free to create. Receiving crypto is also free. Fees apply when you buy crypto with a card, make exchanges, and when network fees are required to process blockchain transactions. P2P trades involve a spread determined by the offer creator.
      </p>
      <p>
        All fees are displayed transparently before you confirm any action. For a full breakdown, visit the <a href="https://www.cryptobot.ltd/fees">Fees page</a>.
      </p>
