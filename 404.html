<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</header>
<main>
    <div class="not-found">
        <h1>404</h1>
        <h2>Page not found</h2>

        <a href="/" class="btn btn-primary">Go to Home</a>
